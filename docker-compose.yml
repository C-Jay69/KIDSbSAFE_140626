services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: kidsbsafe:latest
    container_name: kidsbsafe-web
    # One port serves BOTH the Hono API (/api/*) and the built SPA.
    ports:
      - "3000:3000"
    # Local dev convenience: reads your gitignored .env.
    # On a real host (Render/Fly/Railway) set these as platform env vars instead.
    env_file:
      - .env
    environment:
      NODE_ENV: "production"
      PORT: "3000"
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "bun"
        - "-e"
        - "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
